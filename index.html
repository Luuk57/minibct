<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Planning Tool</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
    .card { background-color: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #444; background: #2c2c2c; color: #fff; box-sizing: border-box; }
    label { font-size: 13px; color: #aaa; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; text-align: center; background-color: #27ae60; font-size: 16px; }
    #melding { text-align: center; color: #f1c40f; margin-top: 10px; font-style: italic; }
  </style>
</head>
<body>

  <h2>📅 Taxi Rit Plannen</h2>

  <div class="card">
    <label for="scriptUrl">Google Web App URL:</label>
    <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/AKfycbzxYXQnulaeUYLqsZHqAKmT9_xpYLgweuZIY0Z4py20cp74YQJRXwz9e17wNIHzVcGF/exec">
  </div>

  <div class="card">
    <label for="afspraakDatumTijd">Afspraak Datum & Tijd:</label>
    <input type="datetime-local" id="afspraakDatumTijd">

    <label for="naam">Naam Klant:</label>
    <input type="text" id="naam" placeholder="Naam van de passagier...">

    <label for="haalLocatie">Haal Locatie:</label>
    <input type="text" id="haalLocatie" placeholder="Ophaaladres...">

    <label for="brengLocatie">Breng Locatie:</label>
    <input type="text" id="brengLocatie" placeholder="Bestemming...">

    <label for="telefoonnummer">Telefoonnummer:</label>
    <input type="text" id="telefoonnummer" placeholder="Bijv. 0612345678...">

    <label for="opmerking">Opmerking:</label>
    <textarea id="opmerking" rows="3" placeholder="Bijv. rolstoel, vluchtnummer..."></textarea>

    <button class="btn" onclick="planRit()">Rit Toevoegen aan Planning</button>
    <div id="melding"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
