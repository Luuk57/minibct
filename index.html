<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Planning & Config Tool</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; }
    .card { background-color: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #444; background: #2c2c2c; color: #fff; box-sizing: border-box; }
    label { font-size: 13px; color: #aaa; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; text-align: center; background-color: #27ae60; font-size: 16px; }
    .btn-small { width: auto; padding: 6px 12px; font-size: 12px; margin-left: 5px; }
    .btn-rood { background-color: #c0392b; }
    .btn-blauw { background-color: #2980b9; }
    .flex-row { display: flex; gap: 8px; align-items: center; }
    #melding { text-align: center; color: #f1c40f; margin-top: 10px; font-style: italic; }
  </style>
</head>
<body>

  <h2>📅 Taxi Rit Plannen</h2>

  <div class="card">
    <label for="scriptUrl">Google Web App URL:</label>
    <div class="flex-row">
      <input type="text" id="scriptUrl" placeholder="Plak hier je Web App URL..." style="margin-bottom:0;">
      <button class="btn btn-blauw btn-small" onclick="laadConfiguratie()">🔄 Laden</button>
    </div>
  </div>

  <!-- Rit Planner Formulier -->
  <div class="card">
    <label for="afspraakDatumTijd">Afspraak Datum & Tijd:</label>
    <input type="datetime-local" id="afspraakDatumTijd">

    <!-- Naam (Dropdown + Vrije Invoer) -->
    <label for="naamSelect">Naam Klant:</label>
    <select id="naamSelect" onchange="opNaamSelectieVeranderd()">
      <option value="">-- Kies een klant of typ nieuw --</option>
    </select>
    <input type="text" id="naamInput" placeholder="Of voer een nieuwe naam in...">

    <!-- Telefoonnummer (Automatisch gekoppeld) -->
    <label for="telefoonnummer">Telefoonnummer:</label>
    <input type="text" id="telefoonnummer" placeholder="Telefoonnummer...">

    <!-- Haal Locatie Dropdown -->
    <label for="haalSelect">Haal Locatie:</label>
    <select id="haalSelect" onchange="document.getElementById('haalInput').value = this.value">
      <option value="">-- Kies ophaallocatie --</option>
    </select>
    <input type="text" id="haalInput" placeholder="Of typ een nieuwe ophaallocatie...">

    <!-- Breng Locatie Dropdown -->
    <label for="brengSelect">Breng Locatie:</label>
    <select id="brengSelect" onchange="document.getElementById('brengInput').value = this.value">
      <option value="">-- Kies brenglocatie --</option>
    </select>
    <input type="text" id="brengInput" placeholder="Of typ een nieuwe brenglocatie...">

    <label for="opmerking">Opmerking:</label>
    <textarea id="opmerking" rows="2" placeholder="Bijv. rolstoel, vluchtnummer..."></textarea>

    <button class="btn" onclick="planRit()">Rit Toevoegen (Auto ID Genereren)</button>
    <div id="melding"></div>
  </div>

  <!-- Beheer Configuratie Mappen -->
  <div class="card">
    <h3>⚙️ Config Dropdowns Beheren</h3>
    
    <label>Beheer Haal/Breng Locaties:</label>
    <div class="flex-row">
      <select id="configType">
        <option value="haal">Haal Locatie</option>
        <option value="breng">Breng Locatie</option>
      </select>
      <input type="text" id="configWaarde" placeholder="Nieuwe locatie..." style="margin-bottom:0;">
    </div>
    <div class="flex-row" style="margin-top: 10px;">
      <button class="btn btn-blauw" onclick="beheerConfig('add')">➕ Toevoegen</button>
      <button class="btn btn-rood" onclick="beheerConfig('delete')">🗑️ Verwijderen</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
